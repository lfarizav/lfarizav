name: Generate snake

on:
  # refresh every day at 03:17 UTC
  schedule:
    - cron: "17 3 * * *"
  # run it by hand from the Actions tab
  workflow_dispatch:
  # regenerate when this workflow changes
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads the contribution graph of the repository owner and draws the snake as SVG.
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2456e6&color_dots=#ebedf0,#c9d8fb,#94aef6,#5c82ee,#2456e6
            dist/snake-dark.svg?palette=github-dark&color_snake=#7ea1ff

      # Publishes the SVGs to the `output` branch so the README can link them with raw URLs.
      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
